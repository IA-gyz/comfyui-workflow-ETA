name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standalone-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Python standalone checks
        run: |
          status=0
          for t in test_*.py; do
            echo "== $t =="
            python "$t" || status=1
          done
          exit $status
      - name: Run frontend check
        run: node test_frontend.cjs
